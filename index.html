<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAEN عهدة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E6B50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAEN عهدة">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--acc:#1E6B50;--bg:#F5F6F3;--card:#FFFFFF;--ink:#17201C;--muted:#55625C;--line:#E1E6E3;--line2:#CDD4D0;--warn-bg:#FBF0DD;--warn-ink:#4A2B00;--bad:#A0301F;--bad-bg:#FBE4E0;--bad-ink:#6E1A10;--acc-soft:color-mix(in srgb,var(--acc) 13%,#fff);--acc-deep:color-mix(in srgb,var(--acc) 78%,#000);--trial:#8C2416;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1412;--card:#18201C;--ink:#E7EDEA;--muted:#A3B0AA;--line:#27322D;--line2:#3A4741;--warn-bg:#3A2C12;--warn-ink:#F3D9A8;--bad:#F0907F;--bad-bg:#3D1F1A;--bad-ink:#F6C7BF;--acc-soft:color-mix(in srgb,var(--acc) 30%,#18201C);--acc-deep:color-mix(in srgb,var(--acc) 40%,#fff);--trial:#F0907F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1412;--card:#18201C;--ink:#E7EDEA;--muted:#A3B0AA;--line:#27322D;--line2:#3A4741;--warn-bg:#3A2C12;--warn-ink:#F3D9A8;--bad:#F0907F;--bad-bg:#3D1F1A;--bad-ink:#F6C7BF;--acc-soft:color-mix(in srgb,var(--acc) 30%,#18201C);--acc-deep:color-mix(in srgb,var(--acc) 40%,#fff);--trial:#F0907F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px}
html.fs-s{font-size:14.5px}html.fs-l{font-size:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.trial{background:var(--bad-bg);color:var(--trial);text-align:center;font-size:.75rem;font-weight:700;padding:3px 8px}
.scr{flex:1;display:flex;flex-direction:column;gap:.8rem;padding:1rem 1rem 1.2rem}
.top{display:flex;align-items:center;gap:.6rem}
.top h1{margin:0;font-size:1.2rem;font-weight:700}
.sub{font-size:.78rem;color:var(--muted)}
.ib{width:44px;height:44px;flex-shrink:0;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib svg{width:20px;height:20px}
[dir="ltr"] .flip{transform:scaleX(-1)}
.btn{min-height:52px;border-radius:15px;border:1.5px solid var(--line2);background:var(--card);font-weight:700;font-size:1rem;padding:0 1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.out{border-color:var(--acc);color:var(--acc-deep)}
.btn.dash{border-style:dashed}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;font-size:.9rem;border-radius:12px}
.btn svg{width:20px;height:20px;flex-shrink:0}
.fld{display:flex;flex-direction:column;gap:.3rem}
.lbl{font-size:.85rem;font-weight:600}
.hint{font-size:.75rem;color:var(--muted);line-height:1.6}
.inp{min-height:48px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);padding:0 .8rem;width:100%}
textarea.inp{padding:.6rem .8rem;min-height:80px;resize:none}
.inp:focus,.btn:focus-visible,.ib:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.inp.big{font-size:1.35rem;font-weight:700}
.err{color:var(--bad);font-size:.8rem;font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:44px;border:none;border-radius:11px;background:transparent;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{min-height:40px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);padding:0 .85rem;cursor:pointer;font-size:.9rem}
.chip.on{border:2px solid var(--acc);background:var(--acc-soft);color:var(--acc-deep);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:.8rem .9rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.hero{background:var(--acc);color:#fff;border-radius:22px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem;cursor:pointer;text-decoration:none;border:none;text-align:start;width:100%}
.hero .k{font-size:.8rem;opacity:.85}
.hero .v{font-size:2.1rem;font-weight:700;line-height:1.15}
.pill{font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.w{background:rgba(255,255,255,.18);color:#fff}
.pill.bad{background:var(--bad);color:#fff}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ok{background:var(--acc-soft);color:var(--acc-deep)}
.tile{min-height:84px;border-radius:16px;border:1.5px solid var(--line2);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;font-weight:700;font-size:.9rem;cursor:pointer}
.tile svg{width:24px;height:24px}
.tile.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.tile.out{border-color:var(--acc);color:var(--acc-deep)}
.banner{border-radius:14px;padding:.65rem .85rem;font-size:.85rem;line-height:1.55;display:flex;gap:.6rem;align-items:center;cursor:pointer;border:none;text-align:start;width:100%}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.bad{background:var(--bad-bg);color:var(--bad-ink)}
.banner.info{background:var(--acc-soft);color:var(--acc-deep)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.65rem .8rem;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:start}
.li:last-child{border-bottom:none}
.li .t{font-size:.92rem;font-weight:600}
.li .m{font-size:.72rem;color:var(--muted)}
.li .a{font-weight:700;white-space:nowrap}
.li.corr{background:var(--warn-bg)}
.pos{color:var(--acc-deep)}.neg{color:var(--bad)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sec{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.95rem;margin-top:.3rem}
.bar{height:8px;border-radius:999px;background:var(--acc-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px}
.spacer{flex:1}
.center{text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{background:var(--line);text-align:start;padding:.45rem .5rem;font-size:.72rem}
.tbl td{padding:.5rem;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:end;direction:ltr}
.tbl tr.over td{background:var(--bad-bg)}
.tbl tr.tot td{font-weight:700;background:var(--acc-soft)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem 1.4rem;padding:0 .8rem;direction:ltr}
.key{height:68px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1.8rem;cursor:pointer}
.dots{display:flex;gap:1.3rem;justify-content:center;direction:ltr}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid #fff}
.dots i.f{background:#fff}
.pinbox{display:flex;gap:.7rem;justify-content:center;direction:ltr}
.pinbox input{width:52px;height:56px;text-align:center;font-size:1.5rem;border-radius:12px;border:1.5px solid var(--line2);background:var(--card)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:1.1rem 1rem calc(1.1rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.75rem;max-height:90vh;overflow:auto}
.sheet h2{margin:0;font-size:1.1rem}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.65rem 1rem;border-radius:12px;font-size:.88rem;z-index:60;max-width:90%;text-align:center}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--line)}
.lock-scr{background:var(--acc);color:#fff;min-height:100vh}
.big-code{font-size:2rem;font-weight:700;letter-spacing:.25rem;direction:ltr;text-align:center;background:var(--card);border:2px dashed var(--acc);border-radius:14px;padding:.8rem}
.prep{font-size:.7rem;color:var(--muted);text-align:center;direction:ltr;letter-spacing:.03em}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);cursor:pointer}
.swatch.on{outline:2px solid var(--ink)}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;z-index:70;font-weight:700;flex-direction:column;gap:.6rem}

.hiddate{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;border:0;padding:0;margin:0}
.datebtn{display:flex;align-items:center;justify-content:space-between;gap:.5rem;cursor:pointer;text-align:start;font-weight:600}
.datebtn svg{width:20px;height:20px;flex-shrink:0;opacity:.7}
.warnline{font-size:.75rem;color:var(--bad);font-weight:600}
#stage{position:fixed;left:0;top:0;width:794px;z-index:-5;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

const DB={db:null,open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('maen-custody-trial',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
tx(m){return this.db.transaction('kv',m).objectStore('kv')},
get(k){if(memOnly)return Promise.resolve(MEM.get(k));return new Promise((res,rej)=>{const r=this.tx('readonly').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
set(k,v){if(memOnly){MEM.set(k,v);return Promise.resolve()}return new Promise((res,rej)=>{const r=this.tx('readwrite').put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
del(k){if(memOnly){MEM.delete(k);return Promise.resolve()}return new Promise((res,rej)=>{const r=this.tx('readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
clear(){if(memOnly){MEM.clear();return Promise.resolve()}return new Promise((res,rej)=>{const r=this.tx('readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
keys(){if(memOnly)return Promise.resolve([...MEM.keys()]);return new Promise((res,rej)=>{const r=this.tx('readonly').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}};

function newState(){return{v:1,lang:'ar',font:'m',theme:'auto',color:'green',langChosen:false,profile:null,adminHash:null,docSeq:0,rSeq:0,tSeq:0,custodies:[],entries:[],descMemo:{},bens:[],otherTypes:[],lastFunding:{},attachData:true,lastBackup:null,pinFails:0,lockUntil:0}}
const cust=id=>S.custodies.find(c=>c.id===id);
const ents=c=>S.entries.filter(e=>e.cid===c.id);
const unsent=c=>ents(c).filter(e=>!e.sett).sort(byDate);
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:a.no-b.no;
const sOut=e=>e.dir==='out'?e.amount:0,sIn=e=>e.dir==='in'?e.amount:0;
const bal=c=>(c.opening||0)+ents(c).reduce((s,e)=>s+sIn(e)-sOut(e),0);
const curOpening=c=>c.settlements.length?c.settlements[c.settlements.length-1].closing:(c.opening||0);
const minDate=c=>c.settlements.length?addDays(c.settlements[c.settlements.length-1].to,1):c.start;
const entryMin=c=>c.settlements.length?c.settlements[c.settlements.length-1].to:c.start;
const perms=()=>S.custodies.filter(c=>c.kind==='perm'&&c.status!=='closed');
const temps=()=>S.custodies.filter(c=>c.kind==='temp'&&c.status!=='closed');
const extUsed=c=>(c.ext||[]).reduce((s,x)=>s+x.days,0);
const deadline=c=>c.fundedAt?addDays(c.fundedAt,c.days+extUsed(c)):null;
const reqTotal=c=>(c.items||[]).reduce((s,i)=>s+i.amount,0);
const itemActual=(c,iid)=>ents(c).filter(e=>e.item===iid).reduce((s,e)=>s+sOut(e),0);
const custName=c=>c.kind==='perm'?L('العهدة المستديمة','Standing custody')+' · '+c.cur:c.purpose;

/* ---------- fun reminders ---------- */
function lateMsg(n){
 if(n>=15)return L('كده مضطرين نحيل أوراقك لفضيلة المفتي يا صاحبي.','That’s it, my friend — your file goes to the Supreme Court of Petty Cash.');
 if(n>=10)return L('10 أيام! كده هنضطر نحيل أوراقك للمدير المالي.','10 days! We’ll have to send your file to the Finance Director.');
 if(n>=7)return L('أسبوع كامل! إحنا بنفكر نرجّعك للدفتر الورق تاني.','A whole week! We’re thinking of sending you back to the paper ledger.');
 if(n>=3)return L(`${n} أيام تأخير؟ المحاسب بدأ يسأل عليك بالاسم.`,`${n} days late? Accounting has started asking for you by name.`);
 return null}
function tempAlert(c){if(c.status!=='open')return null;const left=diffDays(today(),deadline(c));
 if(left>3)return null;
 if(left>0)return{lv:1,badge:L('فاضل ','')+days(left)+L('',' left'),msg:L(`العهدة دي فاضلها ${days(left)}.. الفواتير متجمعة ولا لسه في جيوبك؟`,`${days(left)} left on this one… are the receipts together, or still in your pockets?`)};
 if(left===0)return{lv:2,badge:L('آخر يوم','Last day'),msg:L('النهارده آخر يوم! التسوية مستنياك، والإدارة كمان مستنياك.','Last day today! The settlement is waiting — and so is the office.')};
 const n=-left;return{lv:n>=3?4:3,late:n,badge:L('متأخر ','')+days(n)+L('',' late'),msg:lateMsg(n)||L('اتأخرت يوم.. لسه بنقولها بالذوق.','You’re late… we’re still asking nicely.')}}
function permAlert(c){const un=unsent(c);if(!un.length)return null;const cur=mk(today());
 if(un.some(e=>mk(e.date)<cur)){const n=diffDays(cur+'-01',today())+1;return{lv:n>=3?4:3,late:n,badge:L('شهر فات ماتسوّاش','Last month not settled'),msg:lateMsg(n)||L('الشهر قفل وبنودك لسه عندك.. لسه بنقولها بالذوق.','The month has closed and your entries are still with you… we’re still asking nicely.')}}
 const left=diffDays(today(),eom(cur));
 if(left===0)return{lv:2,badge:L('آخر الشهر','Month end'),msg:L('النهارده آخر الشهر! سوّي اللي عندك قبل ما المحاسبين يقفلوا الدفاتر.','Last day of the month! Settle up before accounting closes the books.')};
 if(left<=3)return{lv:1,badge:L('الشهر بيقفل','Month closing'),msg:L(`الشهر بيقفل بعد ${days(left)}.. ابدأ لمّ فواتيرك من دلوقتي.`,`The month closes in ${days(left)}… start gathering your receipts now.`)};
 return null}
const alertOf=c=>c.kind==='temp'?tempAlert(c):permAlert(c);

function go(name,p={}){V={name,...p};closeSheet();render()}
const FORMS=['entry','funding','create','extend','close'];
function guard(fn){if(V.dirty&&FORMS.includes(V.name)){window._leave=fn;const canSave=['entry','create','extend'].includes(V.name);sheet(`<h2>${L('لسه ماحفظتش','Not saved yet')}</h2><div class="hint" style="font-size:.95rem">${V.name==='entry'?L('البند ده لسه ماتحفظش. تعمل إيه؟','This entry hasn’t been saved. What would you like to do?'):L('اللي كتبته لسه ماتحفظش. تعمل إيه؟','What you typed hasn’t been saved. What would you like to do?')}</div>${canSave?`<button class="btn pri" data-a="leaveSave">${L('احفظ','Save')}</button>`:''}<button class="btn bad" data-a="leaveDiscard">${L('اخرج من غير حفظ','Leave without saving')}</button><button class="btn" data-a="closeSheet">${L('كمّل كتابة','Keep editing')}</button>`);return}fn()}

 const pending=c.status==='pending';const req=reqTotal(c);const spent=ents(c).reduce((s,e)=>s+sOut(e),0);const got=ents(c).reduce((s,e)=>s+sIn(e),0);const pct=got>0?Math.min(100,Math.max(0,spent/got*100)):0;

VIEWS.temp=()=>{const c=cust(V.id);const al=tempAlert(c);const b=bal(c);const pending=c.status==='pending';const dl=deadline(c);const used=extUsed(c);
 const items=(c.items||[]).map(i=>({...i,act:itemActual(c,i.id)}));const unl=itemActual(c,'x');
 const rows=items.map(i=>{const left=i.amount-i.act;return`<tr class="${left<0?'over':''}"><td>${esc(i.label)}</td><td class="n">${money(i.amount)}</td><td class="n">${money(i.act)}</td><td class="n ${left<0?'neg':''}" style="font-weight:700">${money(left)}</td></tr>`}).join('')+(unl?`<tr class="over"><td>${L('بنود غير مدرجة','Unlisted items')}</td><td class="n">—</td><td class="n">${money(unl)}</td><td class="n neg" style="font-weight:700">${money(-unl)}</td></tr>`:'');

/* send */
function sendPlan(c,mode){const un=unsent(c);if(!un.length)return[];const cur=mk(today());const months=[...new Set(un.map(e=>mk(e.date)))].sort();const target=mode==='eom'?months.filter(m=>m<cur):months;
 let from=minDate(c);if(un[0].date<from)from=un[0].date;let opening=curOpening(c);const plans=[];
 for(const m of target){const es=un.filter(e=>mk(e.date)===m);const f=from>m+'-01'?from:m+'-01';const to=m<cur?eom(m):today();const inc=es.reduce((s,e)=>s+sIn(e),0),out=es.reduce((s,e)=>s+sOut(e),0);const closing=opening+inc-out;plans.push({from:f,to,opening,inc,out,closing,ids:es.map(e=>e.id)});opening=closing;from=addDays(to,1)}
 return plans}
VIEWS.send=()=>{const c=cust(V.id);const un=unsent(c);const cur=mk(today());const months=[...new Set(un.map(e=>mk(e.date)))];const cross=months.some(m=>m<cur)&&months.includes(cur);const mode=cross?(V.mode||'today'):'today';const plans=sendPlan(c,mode);let n=S.rSeq;
 const prevM=months.filter(m=>m<cur).sort().slice(-1)[0];
 return`<div class="scr">${topBar(L('إرسال التسوية','Send settlement'),L('العهدة المستديمة · ','Standing custody · ')+c.cur,'cust')}
${!un.length?`<div class="card pad center sub">${L('مافيش بنود جديدة تتبعت.','There are no new entries to send.')}</div>`:''}
${cross?`<div class="banner warn" style="cursor:default"><div>${L(`بنودك معدّية من <b>${mName(prevM)}</b> لـ <b>${mName(cur)}</b>. تحب تبعت لحد فين؟`,`Your entries cross from <b>${mName(prevM)}</b> into <b>${mName(cur)}</b>. Send up to when?`)}</div></div>
<button class="btn" data-a="sendMode" data-v="eom" style="justify-content:flex-start;text-align:start;${mode==='eom'?'border:2px solid var(--acc);background:var(--acc-soft)':''}"><div><div>${L('حتى ','Up to ')}${fd(eom(prevM))}</div><div class="sub" style="font-weight:400">${L('وبنود الشهر ده تفضل مفتوحة عندك','This month’s entries stay open')}</div></div></button>
<button class="btn" data-a="sendMode" data-v="today" style="justify-content:flex-start;text-align:start;${mode==='today'?'border:2px solid var(--acc);background:var(--acc-soft)':''}"><div><div>${L('حتى اليوم','Up to today')}</div><div class="sub" style="font-weight:400">${L('هتطلع تسوية لكل شهر','One settlement per month')}</div></div></button>`:''}
${plans.length?`<div class="grid2">${plans.map(p=>{n++;return`<div class="card pad" style="display:flex;flex-direction:column;gap:.2rem"><b class="num">${rNo(n)}</b><div class="sub">${fds(p.from)} – ${fds(p.to)} · ${p.ids.length} ${L('بنود','entries')}</div><div style="font-size:.8rem">${L('أول المدة ','Opening ')}<b>${N(p.opening)}</b></div><div style="font-size:.8rem">${L('متبقي ','Closing ')}<b>${N(p.closing)}</b></div></div>`}).join('')}</div>
<div class="hint">${L('هيتبعت لكل تسوية ملف PDF بالصور على الواتساب، وملف الإكسيل هيتحفظ على موبايلك وترفقه في نفس المحادثة','Each settlement’s PDF with photos goes to WhatsApp, and its Excel file is saved on your phone for you to attach in the same chat')}.</div>`:''}
<div class="spacer"></div>
${plans.length?`<div class="hint center">${L('متنساش تختار نفسك في الواتساب عشان تحتفظ بنسخة','Remember to pick yourself in WhatsApp to keep a copy')}</div><button class="btn pri" data-a="doSend" data-mode="${mode}">${IC.wa} ${L('إرسال على الواتساب','Send on WhatsApp')}</button>`:''}</div>`};

 if(!/^[\u0600-\u06FF]+( [\u0600-\u06FF]+)+$/.test(nameAr))return er(L('الاسم بالعربي لازم يكون حروف عربي وثنائي على الأقل','Arabic name must be Arabic letters, at least two names'));
 if(!/^[A-Za-z'-]+( [A-Za-z'-]+)+$/.test(nameEn))return er(L('الاسم بالإنجليزي لازم يكون حروف إنجليزي وثنائي على الأقل','English name must be Latin letters, at least two names'));

 if(p1!==p2)return er(L('الرقم السري مش متطابق في المرتين','The two PINs don’t match'));

ACT.savePhone=async d=>{const n=val('nph').replace(/\D/g,'');if(!/^01\d{9}$/.test(n)){$('err').textContent=L('رقم مصري 11 رقم يبدأ بـ 01','Egyptian number: 11 digits starting with 01');return}const ch=S.profile[d.k]!==n;S.profile[d.k]=n;if(d.k==='mgmt'&&ch){const nc=genCode();S.profile.recHash=await sha('rec|'+nc.replace('-',''));await save();closeSheet();return go('recovery',{code:nc})}await save();closeSheet();render()};
ACT.changePin=()=>{sheet(`<h2>${L('تغيير الرقم السري','Change PIN')}</h2><input class="inp big" id="op" type="password" inputmode="numeric" maxlength="4" dir="ltr" placeholder="${L('الرقم الحالي','Current PIN')}"><div class="grid2"><input class="inp big" id="p1" type="password" inputmode="numeric" maxlength="4" dir="ltr" placeholder="${L('الجديد','New')}"><input class="inp big" id="p2" type="password" inputmode="numeric" maxlength="4" dir="ltr" placeholder="${L('تأكيده','Confirm')}"></div><div id="err" class="err"></div><button class="btn pri" data-a="savePin">${L('حفظ','Save')}</button><button class="btn" data-a="closeSheet">${L('إلغاء','Cancel')}</button>`)};
ACT.savePin=async()=>{if((await sha('pin|'+val('op')))!==S.profile.pinHash){$('err').textContent=L('الرقم الحالي غلط','Current PIN is wrong');return}const a=val('p1');if(!/^\d{4}$/.test(a)||a!==val('p2')){$('err').textContent=L('اكتب رقم جديد 4 أرقام مرتين','Enter a new 4-digit PIN twice');return}S.profile.pinHash=await sha('pin|'+a);await save();closeSheet();toast(L('الرقم السري اتغيّر','PIN changed'))};
ACT.setAdmin=()=>{sheet(`<h2>${L('كلمة سر الإدارة','Office password')}</h2><div class="hint">${L('للإدارة بس، 6 حروف أو أرقام على الأقل. محدش غير الإدارة يعرفها.','Office only — at least 6 characters. Only the office should know it.')}</div><input class="inp" id="a1" type="password" dir="ltr" placeholder="••••••"><input class="inp" id="a2" type="password" dir="ltr" placeholder="${L('تأكيدها','Confirm')}"><div id="err" class="err"></div><button class="btn pri" data-a="saveAdmin">${L('حفظ','Save')}</button><button class="btn" data-a="closeSheet">${L('إلغاء','Cancel')}</button>`)};
ACT.saveAdmin=async()=>{const a=val('a1');if(a.length<6||a!==val('a2')){$('err').textContent=L('6 حروف على الأقل ومتطابقة مرتين','At least 6 characters, entered twice');return}S.adminHash=await sha('adm|'+a);await save();closeSheet();toast(L('اتحفظت كلمة سر الإدارة','Office password saved'));render()};
ACT.admin=d=>{sheet(`<h2>${L('كلمة سر الإدارة','Office password')}</h2><input class="inp" id="ap" type="password" dir="ltr" autofocus><div id="err" class="err"></div><button class="btn pri" data-a="adminGo" data-op="${d.op}">${L('متابعة','Continue')}</button><button class="btn" data-a="closeSheet">${L('إلغاء','Cancel')}</button>`)};
ACT.adminGo=async d=>{if((await sha('adm|'+val('ap')))!==S.adminHash){$('err').textContent=L('كلمة السر غلط','Wrong password');return}
 if(d.op==='unlockCode')sheet(`<h2>${L('تعديل كود الموظف','Edit employee code')}</h2><div class="hint">${L('خلي بالك: المستندات القديمة هتفضل بالكود القديم في الملفات اللي اتبعتت.','Note: documents already sent keep the old code.')}</div><input class="inp big" id="nc" dir="ltr" inputmode="numeric" maxlength="3" value="${S.profile.code}"><button class="btn pri" data-a="saveCode">${L('حفظ','Save')}</button>`);
 else if(d.op==='editOpening'){const ps=perms().filter(c=>!c.settlements.length);if(!ps.length){closeSheet();return toast(L('الرصيد الافتتاحي بيتقفل نهائي بعد أول تسوية','Opening balance is final after the first settlement'))}sheet(`<h2>${L('الرصيد الافتتاحي وبداية العهدة','Opening balance and start date')}</h2>${ps.map(c=>`<label class="lbl" for="op_${c.id}">${c.cur}</label><input class="inp big" id="op_${c.id}" dir="ltr" value="${c.opening}">${dateField('st_'+c.id,L('البنود تبدأ من','Entries start from'),c.start,null,today())}`).join('')}<button class="btn pri" data-a="saveOpening">${L('حفظ','Save')}</button>`)}
 else if(d.op==='changeAdmin'){closeSheet();ACT.setAdmin()}
 else if(d.op==='wipe')sheet(`<h2 class="neg">${L('مسح كل البيانات؟','Wipe all data?')}</h2><div class="hint">${L('كل العهد والبنود والصور هتتمسح من الموبايل ده نهائيًا.','All custodies, entries and photos on this phone will be permanently erased.')}</div><button class="btn bad" data-a="wipe">${L('امسح كل حاجة','Erase everything')}</button><button class="btn" data-a="closeSheet">${L('إلغاء','Cancel')}</button>`)};
ACT.saveCode=async()=>{const n=val('nc');if(!/^\d{1,3}$/.test(n))return;S.profile.code=pad(n,3);await save();closeSheet();render()};
ACT.saveOpening=async()=>{perms().filter(c=>!c.settlements.length).forEach(c=>{const v=toNum(val('op_'+c.id));if(!isNaN(v))c.opening=v;const st=val('st_'+c.id);if(st&&st<=today()&&!ents(c).some(e=>e.date<st))c.start=st});await save();closeSheet();toast(L('اتحفظ','Saved'));render()};
ACT.wipe=async()=>{await DB.clear();S=newState();unlocked=false;closeSheet();applyPrefs();go('welcome')};
ACT.backupFull=async()=>{busy(true,L('بجهّز النسخة…','Preparing backup…'));try{const keys=(await DB.keys()).filter(k=>String(k).startsWith('ph:'));const photos={};for(const k of keys)photos[k]=await DB.get(k);const f=new File([JSON.stringify({type:'maen-backup',v:1,full:true,at:new Date().toISOString(),state:S,photos})],`${TRIAL?'TEST-':''}maen-backup-${S.profile.code}-${today()}.txt`,{type:'text/plain'});busy(false);offerShare({share:[f],local:[],txt:L('نسخة احتياطية من أبليكشن العهد','Custody app backup'),kind:'backup'})}catch(e){busy(false);toast(L('ماقدرتش أعمل النسخة','Could not create backup'))}};
async function onRestore(file){try{const j=JSON.parse(await file.text());if(j.type!=='maen-backup'||!j.state||!j.state.profile)throw 0;const go2=async()=>{await DB.clear();S=j.state;await save();if(j.photos)for(const[k,v]of Object.entries(j.photos))await DB.set(k,v);applyPrefs();closeSheet();toast(L('النسخة اترجعت','Backup restored'));unlocked=false;go('lock')};
 if(S.custodies.length&&S.adminHash){V.pendingRestore=go2;sheet(`<h2>${L('في بيانات على الموبايل ده','This phone already has data')}</h2><div class="hint">${L('الاسترجاع هيمسحها. محتاج كلمة سر الإدارة.','Restoring will replace it. Office password required.')}</div><input class="inp" id="ap" type="password" dir="ltr"><div id="err" class="err"></div><button class="btn pri" data-a="restoreGo">${L('استرجاع','Restore')}</button><button class="btn" data-a="closeSheet">${L('إلغاء','Cancel')}</button>`)}
 else if(S.custodies.length){sheet(`<h2>${L('استبدال البيانات الحالية؟','Replace current data?')}</h2><button class="btn bad" data-a="restoreGo2">${L('أيوه، استرجع','Yes, restore')}</button><button class="btn" data-a="closeSheet">${L('إلغاء','Cancel')}</button>`);V.pendingRestore=go2}else await go2()}catch(e){toast(L('الملف ده مش نسخة احتياطية سليمة','That file is not a valid backup'))}}
ACT.restoreGo=async()=>{if((await sha('adm|'+val('ap')))!==S.adminHash){$('err').textContent=L('كلمة السر غلط','Wrong password');return}await V.pendingRestore()};
ACT.restoreGo2=async()=>{await V.pendingRestore()};

/* ---------- sharing ---------- */
function openWA(phone,text){const a=document.createElement('a');a.href='https://wa.me/'+(phone||'')+'?text='+encodeURIComponent(text);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
async function shareText(text){try{if(navigator.share){await navigator.share({text});return'shared'}}catch(e){if(e&&e.name==='AbortError')return'cancel'}openWA('',text);return'wa'}
async function getDownloads(){try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){return null}}
async function shareFiles(files,text){
 try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text});return'shared'}}catch(e){if(e&&e.name==='AbortError')return'cancel'}
 const dl=await getDownloads();
 if(dl){let ok=0;for(const f of files){try{await dl.save({filename:f.name,data:f});ok++}catch(e){if(e&&e.code==='declined')break;if(e&&e.code==='rate_limited'){await new Promise(r=>setTimeout(r,1500));try{await dl.save({filename:f.name,data:f});ok++}catch(_){}}}}
  if(ok){sheet(`<h2>${L('الملفات اتحفظت','Files saved')}</h2><div class="hint" style="font-size:.9rem">${L(`اتحفظ ${ok} ملف على الموبايل. افتح الواتساب، اختار الإدارة ونفسك، وارفق الملفات من التنزيلات.`,`${ok} file(s) saved to your phone. Open WhatsApp, choose the office and yourself, and attach them from Downloads.`)}</div><div class="hint num" style="text-align:start">${files.map(f=>esc(f.name)).join('<br>')}</div><button class="btn pri" data-a="waText" data-t="${esc(text)}">${IC.wa} ${L('افتح الواتساب','Open WhatsApp')}</button><button class="btn" data-a="closeSheet">${L('تمام','Done')}</button>`);return'saved'}return'cancel'}
 sheet(`<h2>${L('المشاركة مش متاحة هنا','Sharing isn’t available here')}</h2><div class="hint">${L('افتح الأبليكشن من متصفح الموبايل (كروم) عشان تقدر تبعت الملفات.','Open the app in your phone’s browser (Chrome) to send files.')}</div><button class="btn" data-a="closeSheet">${L('تمام','OK')}</button>`);return'fail'}
ACT.waText=d=>openWA('',d.t);

/* ---------- reports ---------- */
const excelDate=s=>{const[y,m,d]=s.split('-').map(Number);return(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5};
const ACC_FMT='_(* #,##0.00_);_(* \\(#,##0.00\\);_(* "-"??_);_(@_)';
const DOC_FORMAL={inv:'فاتورة',rcpt:'إيصال',ticket:'تذكرة',toll:'كارتة',etr:'تحويل إلكتروني',none:'بدون'};
function docTypeName(e,lang){if(e.dir==='in')return'';if(e.doc==='other')return e.docOther||'';const t=DOC_TYPES.find(x=>x[0]===e.doc);return t?(lang==='en'?t[2].replace('…',''):DOC_FORMAL[e.doc]||t[1]):''}
function buildXlsx(c,s,es){const R=rNo(s.no);const en=isEn();const wb=XLSX.utils.book_new();
 const odoo=[['Date','Label','Reference','Amount']];es.forEach(e=>odoo.push([e.date,`${e.desc} - ${e.ben} - ${R}`,docNo(e.no),e.dir==='in'?e.amount:-e.amount]));
 const ws=XLSX.utils.aoa_to_sheet(odoo);for(let i=1;i<odoo.length;i++){ws[XLSX.utils.encode_cell({r:i,c:0})]={t:'n',v:excelDate(odoo[i][0]),z:'d-mmm-yy'};ws[XLSX.utils.encode_cell({r:i,c:2})]={t:'s',v:odoo[i][2],z:'@'};ws[XLSX.utils.encode_cell({r:i,c:3})]={t:'n',v:Math.round(odoo[i][3]*100)/100,z:ACC_FMT}}ws['!cols']=[{wch:11},{wch:60},{wch:13},{wch:14}];XLSX.utils.book_append_sheet(wb,ws,'To Odoo');
 const H=en?['Document','Date','Description','Payee','Document type','Photo','Item / reason','In','Out','Balance']:['رقم المستند','التاريخ','البيان','المستفيد','نوع المستند','صورة','البند / السبب','وارد','منصرف','الرصيد'];
 const det=[H,['',s.from,en?'Opening balance':'رصيد أول المدة','','','','','','',s.opening]];let run=s.opening;es.forEach(e=>{run+=(e.dir==='in'?e.amount:-e.amount);const it=c.kind==='temp'&&e.item?(e.item==='x'?(en?'Unlisted':'غير مدرج'):(c.items.find(i=>i.id===e.item)||{}).label||''):'';det.push([docNo(e.no),e.date,e.desc,e.ben,docTypeName(e,S.lang),e.photo?(en?'Yes':'نعم'):(en?'No':'لا'),[it,e.reason].filter(Boolean).join(' — '),e.dir==='in'?e.amount:null,e.dir==='out'?e.amount:null,Math.round(run*100)/100])});
 const wd=XLSX.utils.aoa_to_sheet(det);for(let i=1;i<det.length;i++){wd[XLSX.utils.encode_cell({r:i,c:1})]={t:'n',v:excelDate(det[i][1]),z:'d-mmm-yy'};[7,8,9].forEach(k=>{const a=XLSX.utils.encode_cell({r:i,c:k});if(wd[a]&&typeof wd[a].v==='number')wd[a].z='#,##0.00;[Red]-#,##0.00'})}wd['!cols']=[{wch:12},{wch:11},{wch:42},{wch:24},{wch:14},{wch:7},{wch:28},{wch:12},{wch:12},{wch:12}];XLSX.utils.book_append_sheet(wb,wd,en?'Details':'التفاصيل');
 const p=S.profile;const sum=[[en?'Settlement':'رقم التسوية',R],[en?'Employee':'الموظف',en?p.nameEn:p.nameAr],[en?'Code':'الكود',p.code],[en?'Custody':'العهدة',c.kind==='perm'?(en?'Standing':'مستديمة'):(en?'Temporary ':'مؤقتة ')+tNoS(c.tNo)+' — '+c.purpose],[en?'Currency':'العملة',c.cur],[en?'From':'من',s.from],[en?'To':'حتى',s.to],[en?'Opening':'أول المدة',s.opening],[en?'Total in':'إجمالي الوارد',s.inc],[en?'Total out':'إجمالي المنصرف',s.out],[en?'Closing':'المتبقي',s.closing],[en?'Check':'المطابقة',Math.abs(s.opening+s.inc-s.out-s.closing)<0.005?'OK':'CHECK']];
 if(c.kind==='temp'){sum.push([en?'Days requested':'المدة المطلوبة',c.days],[en?'Extensions':'التمديدات',(c.ext||[]).map(x=>`${x.days} (${x.reason})`).join(' | ')||'-'],[en?'Days late':'أيام التأخير',s.late||0])}
 const wsS=XLSX.utils.aoa_to_sheet(sum);[5,6].forEach(r=>{wsS[XLSX.utils.encode_cell({r,c:1})]={t:'n',v:excelDate(sum[r][1]),z:'d-mmm-yy'}});[7,8,9,10].forEach(r=>{wsS[XLSX.utils.encode_cell({r,c:1})].z='#,##0.00;[Red]-#,##0.00'});wsS['!cols']=[{wch:18},{wch:50}];XLSX.utils.book_append_sheet(wb,wsS,en?'Summary':'ملخص');
 let out=XLSX.write(wb,{bookType:'xlsx',type:'array'});if(!en){try{const cfb=XLSX.CFB.read(new Uint8Array(out),{type:'array'});['xl/worksheets/sheet2.xml','xl/worksheets/sheet3.xml'].forEach(pth=>{const k=cfb.FullPaths.findIndex(p=>p.endsWith(pth));if(k<0)return;const f=cfb.FileIndex[k];let x=new TextDecoder().decode(f.content);x=x.replace(/<sheetView /,'<sheetView rightToLeft="1" ');f.content=new TextEncoder().encode(x);f.size=f.content.length});out=XLSX.CFB.write(cfb,{fileType:'zip',type:'array'})}catch(e){console.warn(e)}}return new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

function reqPage(kind,c,items,extra){const en=isEn(),dir=en?'ltr':'rtl',p=S.profile,acc='#1E6B50';
 const title=kind==='fund'?(en?'Custody funding request':'طلب تمويل عهدة'):kind==='temp'?(en?'Temporary custody request':'طلب عهدة مؤقتة'):(en?'Deficit cover request':'طلب تغطية عجز');
 const box=(k,v)=>`<div style="border:1px solid #CDD4D0;border-radius:8px;padding:7px 11px"><div style="color:#55625C;font-size:10.5px">${k}</div><div style="font-size:14px;font-weight:700">${v}</div></div>`;
 const custLbl=c.kind==='perm'?(en?'Standing custody':'عهدة مستديمة'):(en?'Temporary ':'مؤقتة ')+tNoS(c.tNo);
 let body='';
 if(items&&items.length){body+=`<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:${acc};color:#fff"><th style="padding:8px;width:40px">${en?'No.':'م'}</th><th style="padding:8px;text-align:start">${en?'Item':'البيان'}</th><th style="padding:8px;width:150px">${en?'Amount':'المبلغ'}</th></tr>${items.map((i,k)=>`<tr style="border-bottom:1px solid #E1E6E3;${k%2?'background:#FAFBFA':''}"><td style="padding:8px;text-align:center">${k+1}</td><td style="padding:8px">${esc(i.label)}</td><td style="padding:8px;text-align:end" dir="ltr">${money(i.amount)}</td></tr>`).join('')}</table>`}
 body+=`<div style="margin-top:6px;border:1px solid #CDD4D0;border-radius:10px;overflow:hidden;font-size:14px">${extra.rows.map(r=>`<div style="display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #E1E6E3"><span>${r[0]}</span><b dir="ltr">${r[1]}</b></div>`).join('')}<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#E3EFE9"><b style="font-size:16px">${extra.big[0]}</b><b dir="ltr" style="font-size:24px;color:${acc}">${extra.big[1]}</b></div></div>`;
 const inner=`<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid ${acc};padding-bottom:12px"><div><div style="font-size:25px;font-weight:700">${title}</div><div style="font-size:13px;color:#3B4742">${esc(extra.sub||'')}</div></div><div dir="ltr" style="text-align:right"><img src="${LOGO_DARK}" style="width:125px"><div style="font-size:10.5px;color:#3B4742">MAEN for Plant Proceeds LLC</div><div style="font-size:10.5px;color:#3B4742" dir="rtl">ماء لعائدات النبات ش.ذ.م.م</div></div></div>
 <div style="display:grid;grid-template-columns:1.4fr 1.2fr .9fr .7fr;gap:8px">${box(en?'Custodian':'مستلم العهدة',esc(en?p.nameEn:p.nameAr)+' · '+p.code)}${box(en?'Custody':'العهدة',custLbl)}${box(en?'Date':'التاريخ',fdFull(today()))}${box(en?'Currency':'العملة',c.cur)}</div>${body}${extra.note?`<div style="font-size:12px;color:#3B4742;line-height:1.7">${extra.note}</div>`:''}<div style="flex:1"></div>
 <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:22px;font-size:13px;text-align:center">${[[en?'Requested by':'مقدم الطلب',esc(en?p.nameEn:p.nameAr)],[en?'Approved by':'اعتماد الإدارة','']].map(x=>`<div style="display:flex;flex-direction:column;gap:30px"><b>${x[0]}</b><div style="border-top:1px dotted #55625C;padding-top:3px;font-size:11px;color:#55625C">${x[1]}</div></div>`).join('')}</div>
 <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#55625C;border-top:1px solid #E1E6E3;padding-top:6px"><span>${en?'Issued by the MAEN custody app':'صدر من تطبيق MAEN لإدارة العهد'} · ${fdFull(today())}</span><span>${title}</span></div>`;
 return[pageShell(inner,dir)]}
async function offerRequest(kind,c,items,extra,fname){if(!window.jspdf||!window.html2canvas){sheet(`<h2>${L('محتاج إنترنت','Internet needed')}</h2><div class="hint">${L('أدوات عمل الـ PDF ماتحمّلتش. اتصل بالإنترنت وافتح الأبليكشن تاني.','The PDF tools didn’t load. Connect to the internet and reopen the app.')}</div><button class="btn" data-a="closeSheet">${L('تمام','OK')}</button>`);return}
 try{busy(true,L('بجهّز الطلب…','Preparing the request…'));const blob=await buildPdf(reqPage(kind,c,items,extra));busy(false);offerShare({share:[new File([blob],(TRIAL?'TEST-':'')+fname+'.pdf',{type:'application/pdf'})],local:[],txt:'',kind:'req'})}catch(e){busy(false);fileError(e,true)}}
function pageShell(inner,dir){return`<div dir="${dir}" style="width:794px;height:1123px;box-sizing:border-box;background:#fff;color:#17201C;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;padding:44px 48px 36px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden">${TRIAL?`<div style="position:absolute;top:44%;left:-10%;width:120%;text-align:center;transform:rotate(-28deg);font-size:84px;font-weight:700;color:rgba(160,48,31,.11);pointer-events:none">TEST · تجريبي</div>`:''}${inner}</div>`}
function reportPages(c,s,es,photos){const en=isEn(),dir=en?'ltr':'rtl',p=S.profile,R=rNo(s.no);const acc='#1E6B50';

 const info=`<div style="display:grid;grid-template-columns:1fr 1.3fr 1.5fr .7fr;gap:8px">${box(en?'Settlement no.':'رقم التسوية',`<span dir="ltr">${R}</span>`)}${box(en?'Custodian':'مستلم العهدة',esc(en?p.nameEn:p.nameAr)+' · '+p.code)}${box(en?'Period':'الفترة',(en?'':'من ')+fdFull(s.from)+(en?' – ':' حتى ')+fdFull(s.to))}${box(en?'Currency':'العملة',c.cur)}</div>`;

 const row=(e,i)=>{const neg=e.dir==='out'&&e.amount<0;const dt=docTypeName(e,S.lang);return`<div style="display:grid;grid-template-columns:${cols};border-bottom:1px solid #E1E6E3;font-size:11.5px;background:${e.corrects?'#FBF0DD':i%2?'#FAFBFA':'#fff'}"><div style="padding:6px 5px" dir="ltr">${docNo(e.no)}</div><div style="padding:6px 5px">${fdsP(e.date)}</div><div style="padding:6px 5px">${esc(e.desc)}${e.reason?`<div style="color:#A0301F;font-size:10px">${esc(e.reason)}</div>`:''}</div><div style="padding:6px 5px">${esc(e.ben)}</div><div style="padding:6px 5px;${e.dir==='out'&&e.doc==='none'?'color:#A0301F;font-weight:600':''}">${e.dir==='out'?(esc(dt)||'—'):'—'}${e.photo?' ●':''}</div><div style="padding:6px 5px" dir="ltr">${e.dir==='in'?money(e.amount):''}</div><div style="padding:6px 5px;${neg?'color:#A0301F;font-weight:700':''}" dir="ltr">${e.dir==='out'?money(e.amount):''}</div></div>`};
 const CH=18;const chunks=[];for(let i=0;i<Math.max(es.length,1);i+=CH)chunks.push(es.slice(i,i+CH));
 const noDoc=es.filter(e=>e.dir==='out'&&e.doc==='none'&&e.amount>0&&!e.auto);const ph=es.filter(e=>e.photo).length;

 const sign=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px;font-size:13px;text-align:center">${[[en?'Custodian':'توقيع مستلم العهدة',esc(en?p.nameEn:p.nameAr)],[en?'Reviewer':'المراجع',''],[en?'Management':'الإدارة','']].map(x=>`<div style="display:flex;flex-direction:column;gap:30px"><b>${x[0]}</b><div style="border-top:1px dotted #55625C;padding-top:3px;font-size:11px;color:#55625C">${x[1]}</div></div>`).join('')}</div>`;
 const totalPages=chunks.length+(c.kind==='temp'?1:0)+photos.length;let pn=0;

 const pages=chunks.map((ch,k)=>{const last=k===chunks.length-1;return pageShell(`${head}${k===0?info+`<div style="display:flex;justify-content:space-between;background:#F5F6F3;border-radius:8px;padding:7px 12px;font-size:13px"><span>${en?'Opening balance':'رصيد العهدة أول المدة'}</span><b dir="ltr">${money(s.opening)}</b></div>`:''}<div style="border:1px solid #9AA8A1;border-radius:8px;overflow:hidden">${th}${ch.map((e,i)=>row(e,k*CH+i)).join('')}${last?`<div style="display:grid;grid-template-columns:${cols};background:#E3EFE9;font-weight:700;font-size:12.5px"><div style="padding:8px 5px;grid-column:span 5">${en?'Total':'الإجمالي'}</div><div style="padding:8px 5px" dir="ltr">${money(s.inc)}</div><div style="padding:8px 5px" dir="ltr">${money(s.out)}</div></div>`:''}</div>${last?`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b style="font-size:14px">${en?'Remaining in custody:':'متبقي من العهدة:'}</b><div style="border:2px solid ${acc};border-radius:8px;padding:5px 16px;font-size:19px;font-weight:700" dir="ltr">${money(s.closing)} ${c.cur}</div><div style="font-size:11px;color:#55625C">${en?'Entries without document':'بنود بدون مستند'}: ${noDoc.length}${noDoc.length?` (${money(noDoc.reduce((a,e)=>a+e.amount,0))})`:''} · ${en?'Photos attached':'صور مرفقة'}: ${ph}</div></div>${extInfo}<div style="flex:1"></div>${sign}`:'<div style="flex:1"></div>'}${foot()}`,dir)});
 if(c.kind==='temp'){const items=c.items.map(i=>({...i,act:es.filter(e=>e.item===i.id).reduce((a,e)=>a+sOut(e),0)}));const unl=es.filter(e=>e.item==='x');const unlA=unl.reduce((a,e)=>a+sOut(e),0);
  pages.push(pageShell(`${head}<div style="font-size:17px;font-weight:700">${en?'Requested vs actual':'المطلوب مقابل الفعلي'}</div><table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr style="background:${acc};color:#fff"><th style="padding:7px;text-align:start">${en?'Item':'البند'}</th><th style="padding:7px">${en?'Requested':'المطلوب'}</th><th style="padding:7px">${en?'Actual':'الفعلي'}</th><th style="padding:7px">${en?'Difference':'الفرق'}</th></tr>${items.map(i=>{const d=i.amount-i.act;return`<tr style="${d<0?'background:#FBE4E0':''};border-bottom:1px solid #E1E6E3"><td style="padding:7px">${esc(i.label)}${d<0?`<div style="color:#A0301F;font-size:10.5px">${es.filter(e=>e.item===i.id&&e.reason).map(e=>esc(e.reason)).join(' · ')}</div>`:''}</td><td style="padding:7px" dir="ltr">${money(i.amount)}</td><td style="padding:7px" dir="ltr">${money(i.act)}</td><td style="padding:7px;${d<0?'color:#A0301F;font-weight:700':''}" dir="ltr">${money(d)}</td></tr>`}).join('')}${unl.length?`<tr style="background:#FBE4E0;border-bottom:1px solid #E1E6E3"><td style="padding:7px">${en?'Unlisted items':'بنود غير مدرجة'}<div style="color:#A0301F;font-size:10.5px">${unl.map(e=>esc(e.desc)+': '+esc(e.reason)).join(' · ')}</div></td><td style="padding:7px">—</td><td style="padding:7px" dir="ltr">${money(unlA)}</td><td style="padding:7px;color:#A0301F;font-weight:700" dir="ltr">${money(-unlA)}</td></tr>`:''}<tr style="background:#E3EFE9;font-weight:700"><td style="padding:7px">${en?'Total':'الإجمالي'}</td><td style="padding:7px" dir="ltr">${money(reqTotal(c))}</td><td style="padding:7px" dir="ltr">${money(items.reduce((a,i)=>a+i.act,0)+unlA)}</td><td style="padding:7px" dir="ltr">${money(reqTotal(c)-items.reduce((a,i)=>a+i.act,0)-unlA)}</td></tr></table><div style="flex:1"></div>${foot()}`,dir))}
 photos.forEach(({e,src})=>pages.push(pageShell(`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid ${acc};padding-bottom:10px"><div><div style="font-size:18px;font-weight:700">${esc(e.desc)}</div><div style="font-size:12.5px;color:#3B4742">${fdFull(e.date)} · ${esc(e.ben)} · ${esc(docTypeName(e,S.lang))}</div></div><div style="text-align:end"><div dir="ltr" style="font-size:17px;font-weight:700">${docNo(e.no)}</div><div dir="ltr" style="font-size:15px">${money(e.amount)} ${c.cur}</div></div></div><div style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0"><img src="${src}" style="max-width:100%;max-height:900px;object-fit:contain"></div>${foot()}`,dir)));

const fdFull=s=>{if(!s)return'';const d=parseD(s);return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)+'/'+d.getFullYear()};
const fdsP=s=>{const d=parseD(s);return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)};
async function buildPdf(pages,prog){const{jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4',compress:true});const st=$('stage');window.scrollTo(0,0);try{await document.fonts.ready}catch(e){}
 for(let i=0;i<pages.length;i++){if(prog)prog(i+1,pages.length);st.innerHTML=pages[i];const imgs=[...st.querySelectorAll('img')];await Promise.all(imgs.map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));const cv=await html2canvas(st.firstElementChild,{scale:1.3,backgroundColor:'#ffffff',useCORS:true,logging:false,scrollX:0,scrollY:0});if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.75),'JPEG',0,0,595.28,841.89);cv.width=0;cv.height=0;await new Promise(r=>setTimeout(r,30))}
 st.innerHTML='';return pdf.output('blob')}

function fileError(e,saved){console.error(e);if(e&&e.code==='nolibs'){sheet(`<h2>${L('محتاج إنترنت','Internet needed')}</h2><div class="hint">${saved?L('التسوية محفوظة. اتصل بالإنترنت وافتح الأبليكشن تاني، وابعت الملفات من "إعادة إرسال ملفات التسوية".','The settlement is saved. Connect to the internet, reopen the app and use “Re-send settlement files”.'):L('أدوات عمل الملفات ماتحمّلتش. اتصل بالإنترنت وافتح الأبليكشن تاني. البنود لسه مفتوحة ومااتقفلتش.','The file tools didn’t load. Connect to the internet and reopen the app. Your entries are still open, nothing was locked.')}</div><button class="btn" data-a="closeSheet">${L('تمام','OK')}</button>`);return}
 sheet(`<h2>${L('حصلت مشكلة في عمل الملفات','Could not create the files')}</h2><div class="hint">${saved?L('التسوية محفوظة. جرّب "إعادة إرسال ملفات التسوية" من صفحة العهدة.','The settlement is saved. Try “Re-send settlement files” from the custody page.'):L('البنود لسه مفتوحة ومااتقفلتش، جرّب تاني.','Your entries are still open, nothing was locked. Please try again.')}</div><div class="hint num">${esc(e&&e.message||'')}</div><button class="btn" data-a="closeSheet">${L('تمام','OK')}</button>`)}
function csvOdoo(c,s,es){const R=rNo(s.no);const q=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;const rows=['Date,Label,Reference,Amount'];es.forEach(e=>{const a=e.dir==='in'?e.amount:-e.amount;rows.push([e.date,q(`${e.desc} - ${e.ben} - ${R}`),docNo(e.no),(Math.round(a*100)/100).toFixed(2)].join(','))});return new Blob(['\ufeff'+rows.join('\r\n')+'\r\n'],{type:'text/csv'})}
async function makeSettlementFiles(c,items){if(!window.XLSX||!window.jspdf||!window.html2canvas)throw{code:'nolibs'};
 const share=[],local=[];const pre=TRIAL?'TEST-':'';let txt='';
 for(const {s,es} of items){busy(true,L('بجهّز ملفات ','Preparing ')+rNo(s.no)+'…');const base=`${pre}${rNo(s.no).replace(/\//g,'-')}-${c.cur}`;
  const photos=[];for(const e of es.filter(e=>e.photo)){const src=await DB.get('ph:'+e.id);if(src)photos.push({e,src})}
  const blob=await buildPdf(reportPages(c,s,es,photos),(i,n)=>busy(true,L(`بجهّز ${rNo(s.no)} · صفحة ${i} من ${n}`,`Preparing ${rNo(s.no)} · page ${i} of ${n}`)));
  share.push(new File([blob],base+'.pdf',{type:'application/pdf'}));
  local.push(new File([buildXlsx(c,s,es)],base+'.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  txt+=L(`تسوية عهدة ${rNo(s.no)}${c.kind==='temp'?' (قفل عهدة مؤقتة '+tNoS(c.tNo)+')':''}\n${S.profile.nameAr} (${S.profile.code})\nالفترة: ${fdFull(s.from)} - ${fdFull(s.to)}\nالمتبقي: ${MW(s.closing)} ${c.cur}\n\n`,`Custody settlement ${rNo(s.no)}${c.kind==='temp'?' (closing temporary custody '+tNoS(c.tNo)+')':''}\n${S.profile.nameEn} (${S.profile.code})\nPeriod: ${fdFull(s.from)} - ${fdFull(s.to)}\nRemaining: ${money(s.closing)} ${c.cur}\n\n`)}
 busy(false);return{share,local,txt:txt.trim(),kind:'sett'}}

<div class="hint num" style="text-align:start;line-height:1.9">${[...pack.share,...pack.local].map(f=>esc(f.name)).join('<br>')}</div>

${tip}<button class="btn pri" data-a="doShare">${isB?'':IC.wa} ${isB?L('احفظها على Drive','Save to Drive'):isR?L('ابعت الطلب على الواتساب','Send the request on WhatsApp'):L('١. ابعت الـ PDF على الواتساب','1. Send the PDF on WhatsApp')}</button>
${isB?`<button class="btn" data-a="saveBackupLocal">${L('احفظها على الموبايل بس','Save to this phone only')}</button>`:''}
<button class="btn" data-a="closeSheet">${L('بعدين','Later')}</button>`)}
async function saveLocal(f){const dl=await getDownloads();if(dl){try{await dl.save({filename:f.name,data:f});return true}catch(e){return false}}try{const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return true}catch(e){return false}}
ACT.doShare=async()=>{const p=PENDING;if(!p)return;let shared=false;
 try{if(navigator.canShare&&navigator.canShare({files:p.share})){await navigator.share({files:p.share});shared=true}}catch(e){if(e&&e.name==='AbortError'){toast(L('اتلغى الإرسال، تقدر تبعت تاني من نفس الزرار','Sending cancelled — you can try again'));return}}
 for(const f of p.local)await saveLocal(f);
 if(p.kind==='backup'&&shared){S.lastBackup=today();await save()}
 if(shared){if(!p.local.length){closeSheet();toast(L('تمام','Done'));if(V.name==='settings')render();return}sheet(`<h2>${L('٢. ارفق ملف الإكسيل','2. Attach the Excel file')}</h2><div class="hint" style="font-size:.92rem;line-height:1.9">${L('الإكسيل اتحفظ في التنزيلات. ارجع لنفس محادثة الواتساب، ودوس <b>المشبك 📎</b>، ثم <b>مستند</b>، واختار الملف:','The Excel file is in Downloads. Go back to the same WhatsApp chat, tap the <b>paperclip 📎</b>, then <b>Document</b>, and pick:')}</div><div class="big-code" style="font-size:.95rem;letter-spacing:0">${p.local.map(f=>esc(f.name)).join('<br>')}</div><button class="btn pri" data-a="closeSheet">${L('تمام، ارفقته','Done, attached')}</button>`);return}
 let ok=0;for(const f of p.share)if(await saveLocal(f))ok++;
 if(p.kind==='backup'&&ok){S.lastBackup=today();await save()}
 sheet(`<h2>${L('الملفات اتحفظت على الموبايل','Files saved to your phone')}</h2><div class="hint" style="font-size:.9rem">${L('المشاركة المباشرة مش متاحة هنا، فالملفات اتحفظت في التنزيلات. افتح الواتساب، اختار المحادثة، ودوس المشبك ثم "مستند" وارفقها.','Direct sharing isn’t available here, so the files were saved to Downloads. Open WhatsApp, pick the chat, tap the paperclip, then “Document”, and attach them.')}</div><div class="hint num" style="text-align:start">${[...p.share,...p.local].map(f=>esc(f.name)).join('<br>')}</div><button class="btn" data-a="closeSheet">${L('تمام','Done')}</button>`)};
ACT.saveBackupLocal=async()=>{const p=PENDING;if(!p)return;let ok=0;for(const f of p.share)if(await saveLocal(f))ok++;if(ok){S.lastBackup=today();await save();closeSheet();toast(L('النسخة اتحفظت في التنزيلات. انقلها للدرايف أو ابعتها لنفسك عشان ماتضيعش مع الموبايل.','Backup saved to Downloads. Copy it to Drive or send it to yourself so it isn’t lost with the phone.'));if(V.name==='settings')render()}};

ACT.pickDate=d=>{const el=$(d.for);if(!el)return;try{if(el.showPicker){el.showPicker();return}}catch(e){}el.style.pointerEvents='auto';el.focus();el.click();el.style.pointerEvents='none'};
ACT.install=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render()};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;const a=el.dataset.a;if(!ACT[a])return;if(a!=='ovclose')ev.preventDefault();if(el.disabled)return;Promise.resolve(ACT[a](el.dataset,el,ev)).catch(e=>{console.error(e);busy(false);toast(L('حصلت مشكلة','Something went wrong'))})});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.dataset&&el.dataset.datefield){const t=$(el.id+'_txt');if(t)t.textContent=fdNice(el.value)}if(el.dataset.a==='photo'&&el.files[0]){readEntryForm();V.d.photo=await compress(el.files[0]);V.dirty=true;el.value='';V.keepScroll=window.scrollY;render()}else if(el.dataset.a==='closePhoto'&&el.files[0]){V.photo=await compress(el.files[0]);V.dirty=true;el.value='';render()}else if(el.dataset.a==='restore'&&el.files[0]){await onRestore(el.files[0]);el.value=''}else if(el.id==='desc'&&V.name==='entry'){const m=S.descMemo[el.value.trim()];if(m){if(!$('amt').value)$('amt').value=money(m.amount).replace(/,/g,'');if(!$('ben').value)$('ben').value=m.ben;liveEntry()}}});
document.addEventListener('input',ev=>{const el=ev.target;if(FORMS.includes(V.name)&&el.closest&&el.closest('#app'))V.dirty=true;if(el.id==='nEn'){$('nEnWarn').textContent=/[\u0600-\u06FF]/.test(el.value)?L('الكيبورد بالعربي، غيّره للإنجليزي من زرار 🌐 أو مسطرة المسافة','The keyboard is in Arabic — switch it to English with the 🌐 key or the space bar'):''}if(el.id==='nAr'){$('nArWarn').textContent=/[A-Za-z]/.test(el.value)?L('الكيبورد بالإنجليزي، غيّره للعربي من زرار 🌐 أو مسطرة المسافة','The keyboard is in English — switch it to Arabic'):''}
 if(V.name==='entry'&&(el.id==='amt'||el.id==='item'))liveEntry();
 if(V.name==='funding'&&el.dataset.fi!==undefined){const k=+el.dataset.fi;V.items[k][el.dataset.ff]=el.value;if(k===V.items.length-1&&el.value.trim()){V.items.push({label:'',amount:''});const pos=el.selectionStart,ff=el.dataset.ff;render();const n=document.querySelector(`[data-fi="${k}"][data-ff="${ff}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}else{const c=cust(V.id);const tot=V.items.reduce((s,i)=>s+(toNum(i.amount)||0),0);const b=bal(c);$('fcalc').innerHTML=fundCalc(tot,b,tot-b,c);$('fsend').disabled=!(tot-b>0)}}
 if(V.name==='create'&&el.dataset.ci!==undefined){const k=+el.dataset.ci;V.d.items[k][el.dataset.cf]=el.value;if(k===V.d.items.length-1&&el.value.trim()){readCreate();V.d.items.push({label:'',amount:''});const pos=el.selectionStart,cf=el.dataset.cf;render();const n=document.querySelector(`[data-ci="${k}"][data-cf="${cf}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}else{const tot=V.d.items.reduce((s,i)=>s+(toNum(i.amount)||0),0);$('ctot').innerHTML=`<b>${L('مبلغ التمويل المطلوب','Funding requested')}</b><b style="font-size:1.3rem;color:var(--acc-deep)">${N(tot)} <small>${V.d.cur}</small></b>`}}
 if(V.name==='create'&&el.id==='lastR'){const h=$('rhint');if(h)h.innerHTML=L('أول تسوية من الأبليكشن هتبقى ','Your first app settlement will be ')+`<b class="num">${rNo((parseInt(el.value)||0)+1)}</b>`}});
function liveEntry(){const c=cust(V.cid);const e=V.eid?S.entries.find(x=>x.id===V.eid):null;const a=toNum($('amt').value)||0;const after=bal(c)-(e?(e.dir==='in'?e.amount:-e.amount):0)+a*(V.d.dir==='in'?1:-1);const el=$('after');if(el){el.innerHTML=N(after);el.className=after<0?'neg':''}}
async function compress(file){return new Promise((res)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const m=1400;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,m/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',0.62))};img.onerror=()=>{URL.revokeObjectURL(url);res('')};img.src=url})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')window._hid=Date.now();else if(S&&S.profile&&unlocked&&window._hid&&Date.now()-window._hid>5*60e3){unlocked=false;go('lock',{pin:''})}});


/* ---------- installable / offline ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
/* ---------- shared receipts (share target) ---------- */
let SHARED=null;
async function checkShared(){try{if(!('caches' in window))return;const c=await caches.open('maen-share');const r=await c.match('shared-file');if(!r)return;const blob=await r.blob();await c.delete('shared-file');if(!/^image\//.test(blob.type)){toast(L('الملف ده مش صورة، ابعت الإيصال كصورة','That file is not an image — share the receipt as an image'));return}SHARED=await compress(blob)}catch(e){}}
function useShared(){if(!SHARED||!unlocked)return false;const ph=SHARED;SHARED=null;const list=[...perms(),...temps()].filter(c=>c.status!=='pending');if(!list.length){toast(L('اعمل عهدة الأول عشان ترفق الإيصال','Create a custody first to attach the receipt'));return false}
 const open=c=>{ACT.newEntry({id:c.id});V.d.dir='out';V.d.doc='etr';V.d.photo=ph;V.dirty=true;render();toast(L('الإيصال اتعرّف. كمّل المبلغ والبيان واحفظ','Receipt attached. Fill in the amount and description, then save'))};
 if(list.length===1){open(list[0]);return true}window._sharedOpen=open;sheet(`<h2>${L('الإيصال ده على أنهي عهدة؟','Which custody is this receipt for?')}</h2>${list.map(c=>`<button class="btn" data-a="sharedPick" data-id="${c.id}" style="justify-content:space-between"><span>${esc(custName(c))}</span><span class="num sub">${money(bal(c))}</span></button>`).join('')}<button class="btn" data-a="closeSheet">${L('إلغاء','Cancel')}</button>`);return true}
ACT.sharedPick=d=>{closeSheet();window._sharedOpen&&window._sharedOpen(cust(d.id))};

/* ---------- boot ---------- */
(async function boot(){try{await DB.open()}catch(e){memOnly=true}
 if(/[?&]shared=1/.test(location.search)){await checkShared();try{history.replaceState(null,'',location.pathname)}catch(e){}}
 try{S=await DB.get('state')}catch(e){S=null}
 if(!S){S=newState();const nl=(navigator.language||'').toLowerCase().startsWith('ar')?'ar':(navigator.language?'en':'ar');S.lang=nl}
 S=Object.assign(newState(),S);applyPrefs();
 if(!S.profile)V={name:S.langChosen?'setup':'welcome',draft:{}};else V={name:'lock',pin:''};
 render();if(memOnly)toast(L('التخزين مش متاح في المتصفح ده، البيانات مش هتتحفظ','Storage is unavailable in this browser — data won’t be saved'))})();
</script>
